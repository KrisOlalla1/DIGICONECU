spring.application.name=network-management-service
server.port=8082

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/NetworkManagementDB
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============ CIRCUIT BREAKER CONFIGURATION ============

# Número máximo de fallos consecutivos antes de abrir el circuito
circuit-breaker.max-failures=5

# Latencia máxima tolerada (ms) - si se excede repetidamente, abre el circuito
circuit-breaker.max-latency-ms=4000

# Tiempo de espera antes de intentar recuperar (segundos)
circuit-breaker.recovery-timeout-seconds=60

# Timeout para health-check activo (ms)
circuit-breaker.health-check-timeout-ms=5000

# ============ LOGGING ============
logging.level.com.digiconecu=INFO

# ============ SCHEDULING ============
spring.main.allow-bean-definition-overriding=true