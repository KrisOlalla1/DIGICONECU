version: '3.8'
services:
  db-network:
    image: postgres:15
    container_name: db-network-management
    environment:
      POSTGRES_DB: NetworkManagementDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  network-service:
    build: .
    container_name: network-management-service
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db-network
      DB_USER: postgres
      DB_PASSWORD: password
    depends_on:
      - db-network