codigos_iso:
  AM04:
    descripcion: "Insufficient Funds"
    mensaje: "El banco no tiene fondos suficientes para completar la transacción"
    categoria: "negocio"

  AC01:
    descripcion: "Incorrect Account Number"
    mensaje: "El número de cuenta destino es incorrecto o no existe"
    categoria: "negocio"

  AC04:
    descripcion: "Closed Account"
    mensaje: "La cuenta destino está cerrada"
    categoria: "negocio"

  AC06:
    descripcion: "Blocked Account"
    mensaje: "La cuenta destino está bloqueada"
    categoria: "negocio"

  AG01:
    descripcion: "Transaction Forbidden"
    mensaje: "La transacción está prohibida por reglas de negocio"
    categoria: "negocio"

  MS03:
    descripcion: "Technical Error"
    mensaje: "Error técnico en el sistema del banco destino"
    categoria: "tecnico"

  DUPL:
    descripcion: "Duplicate Transaction"
    mensaje: "La transacción ya fue procesada previamente"
    categoria: "negocio"

  UNKNOWN:
    descripcion: "Unknown Error"
    mensaje: "Error desconocido o no mapeado del banco"
    categoria: "tecnico"
