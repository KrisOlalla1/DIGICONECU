# ========================================
# SWITCH BANCARIO - CONFIGURACIÓN
# ========================================

# ----------------------------------------
# Información de la aplicación
# ----------------------------------------
spring.application.name=switch-transaccional
server.port=8083

# ----------------------------------------
# PostgreSQL Database Configuration
# ----------------------------------------
# DESARROLLO LOCAL (Descomenta para usar localmente)
spring.datasource.url=jdbc:postgresql://localhost:5433/switch_db
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# PRODUCCIÓN - Google Cloud SQL (Comenta las líneas de arriba y descomenta estas)
# spring.datasource.url=jdbc:postgresql://google/switch_db?cloudSqlInstance=aqueous-depth-478400-k3:us-central1:arcbank-db-instance&socketFactory=com.google.cloud.sql.postgres.SocketFactory&ipTypes=PUBLIC
# spring.datasource.username=postgres
# spring.datasource.password=Arqui123@

# ----------------------------------------
# JPA/Hibernate Configuration
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ----------------------------------------
# Redis Configuration (Para Idempotencia)
# ----------------------------------------
# DESARROLLO LOCAL
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000

# PRODUCCIÓN (Ajusta según tu Redis en Cloud)
# spring.data.redis.host=10.x.x.x
# spring.data.redis.port=6379
# spring.data.redis.password=tu_password_redis

# TTL para idempotencia (en segundos) - 24 horas = 86400
redis.idempotencia.ttl=86400

# ----------------------------------------
# HTTP Client Configuration (Para bancos)
# ----------------------------------------
http.client.connection.timeout=5000
http.client.socket.timeout=10000
http.client.max.connections=100
http.client.max.per.route=20

# ----------------------------------------
# Logging Configuration
# ----------------------------------------
logging.level.root=INFO
logging.level.com.arcbank.switch=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ----------------------------------------
# Actuator Configuration
# ----------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ----------------------------------------
# Configuración de Transacciones
# ----------------------------------------
# Estados válidos del switch
switch.estados.validos=Enviado,Procesando,Exitoso,Fallido,Timeout

# Timeout para comunicación con bancos (milisegundos)
switch.timeout.banco=10000

# Reintentos máximos en caso de error
switch.max.reintentos=3
