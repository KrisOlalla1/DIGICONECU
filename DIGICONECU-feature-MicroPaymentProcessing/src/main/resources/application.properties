server.port=8081
spring.application.name=payment-processing-service

# Configuracion BD (Ajusta con tus credenciales locales o de Docker)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:PaymentProcessingDB}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ============ REDIS - IDEMPOTENCIA RF-03 ============
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms
spring.data.redis.connect-timeout=2000ms

# TTL de idempotencia en horas (24h según RF-03)
idempotencia.ttl.hours=${IDEMPOTENCIA_TTL_HOURS:24}

# Logging
logging.level.com.payment=INFO

# URLs de servicios externos
network.service.url=${NETWORK_SERVICE_URL:http://localhost:8082}
balance.service.url=${BALANCE_SERVICE_URL:http://localhost:8083}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
error.mapping.url=${ERROR_MAPPING_URL:http://localhost:8087}

# ============ CONFIGURACION DEL SWITCH TRANSACCIONAL ============

# Timeout para esperar respuesta del banco destino (milisegundos)
switch.timeoutMs=3000

# Política de reintentos determinista (milisegundos): Inmediato, 800ms, 2s, 4s
switch.retryDelays=0,800,2000,4000

# Número máximo de reintentos
switch.maxRetries=4

# Límite máximo por transacción (USD)
switch.maxTransactionAmount=50000.00

# Monedas permitidas
switch.allowedCurrencies=USD,EUR

# Latencia máxima tolerada (ms) - para monitoreo
switch.maxLatencyMs=200

# TPS objetivo mínimo
switch.targetTps=100

# ============ ACTUATOR Y METRICAS ============
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always